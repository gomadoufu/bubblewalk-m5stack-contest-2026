[platformio]
default_envs = participant

[env]
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/heads/develop.zip
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool

lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.5

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
  -D NEOHEX_PIN=2
  -D NEOHEX_COUNT=37
  -D NEOHEX_BRIGHTNESS=24
  -D NANO_H2_BLUE_LED_PIN=4
  -D NANO_H2_BUTTON_PIN=9
  -D NANO_H2_RGB_POWER_PIN=10
  -D NANO_H2_RGB_DATA_PIN=11
  -D TOPIC_ID_HASH=0x20260801UL
  -D TOPIC_VERSION=2
  -D TOPIC_LEFT_RGB=0x12CFEEUL
  -D TOPIC_RIGHT_RGB=0xFF4FA7UL
  -D DEFAULT_OPINION_VALUE=128
  -D HISTOGRAM_BINS=16
  -D RETENTION_MINUTES=15
  -D DEDUP_WINDOW_MS=3000UL
  -D UNIQUE_PEER_CAPACITY=32
  -D ENCOUNTER_SAMPLE_CAPACITY=16
  -D SYNC_WINDOW_TIMEOUT_MS=60000UL
  -D BLE_PAYLOAD_UPDATE_MS=1000UL
  -D PARTICIPANT_ADV_WINDOW_MS=1200UL
  -D PARTICIPANT_SCAN_WINDOW_MS=1200UL
  -D PARTICIPANT_PHASE_JITTER_MS=500UL
  -D NEOHEX_ENCOUNTER_OUTER_RING_COUNT=18

[env:bringup]
build_flags =
  ${env.build_flags}

[env:advertiser]
build_flags =
  ${env:bringup.build_flags}
  -D ROLE_ADVERTISER=1

[env:scanner]
build_flags =
  ${env:bringup.build_flags}
  -D ROLE_SCANNER=1

[env:participant]
build_flags =
  ${env:bringup.build_flags}
  -D ROLE_PARTICIPANT=1

[env:node01_bringup]
build_flags =
  ${env:bringup.build_flags}

[env:node02_bringup]
build_flags =
  ${env:bringup.build_flags}

[env:node03_bringup]
build_flags =
  ${env:bringup.build_flags}

[env:node04_bringup]
build_flags =
  ${env:bringup.build_flags}

[env:node05_bringup]
build_flags =
  ${env:bringup.build_flags}

[env:node01_scan]
build_flags =
  ${env:scanner.build_flags}

[env:node02_adv]
build_flags =
  ${env:advertiser.build_flags}

[env:node03_adv]
build_flags =
  ${env:advertiser.build_flags}

[env:node04_adv]
build_flags =
  ${env:advertiser.build_flags}

[env:node05_adv]
build_flags =
  ${env:advertiser.build_flags}

[env:node01_adv]
build_flags =
  ${env:advertiser.build_flags}

[env:node02_scan]
build_flags =
  ${env:scanner.build_flags}

[env:node03_scan]
build_flags =
  ${env:scanner.build_flags}

[env:node04_scan]
build_flags =
  ${env:scanner.build_flags}

[env:node05_scan]
build_flags =
  ${env:scanner.build_flags}

[env:node01_participant]
build_flags =
  ${env:participant.build_flags}

[env:node02_participant]
build_flags =
  ${env:participant.build_flags}

[env:node03_participant]
build_flags =
